server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Forward API calls to the collector container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 5m;
    }

    # Single-page app: unknown paths (like /runs/123) load index.html,
    # and React Router decides what to show.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
